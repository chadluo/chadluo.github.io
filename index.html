<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Chad Luo</title>
  <link rel="stylesheet" href="/styles.css" />
  <script type="application/ld+json">
  [{% for project in site.data.projects %}
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": {{ project.name | jsonify }},
      "url": {{ project.url | jsonify }},
      "description": {{ project.description | jsonify }},
      "datePublished": "{{ project.year }}"{% if project.platform %},
      "targetProduct": {{ project.platform | jsonify }}{% endif %}
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}]
  </script>
</head>

<body>
  <main class="container">
    <h1>Chad Luo</h1>

    <dl class="projects">
      {% for project in site.data.projects %}
      <div>
        <dt><a href="{{ project.url }}">{{ project.name }}</a>
        <dd>{{ project.description }}
          {% if project.platform %}
        <dd class="platform">{{ project.platform }}{% endif %}
        <dd><time datetime="{{ project.year }}">{{ project.year }}</time>
      </div>
      {% endfor %}
    </dl>

    <p>pretending to know things

    <p><a href="/uses/">Uses</a>

    <p><a href="https://github.com/chadluo">GitHub</a> &middot; <a href="https://www.behance.net/chadluo">Behance</a>
  </main>
</body>

</html>
